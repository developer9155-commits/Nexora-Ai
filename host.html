<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hosted Website - Nexora AI</title>
<script>(function(){var p=new URLSearchParams(location.search);if(p.get('site')||p.get('project'))return;try{if(JSON.parse(localStorage.getItem('nx_session'))?.provider!=='firebase')location.replace('login.html?next=host.html')}catch{location.replace('login.html?next=host.html')}})();</script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#050505;--s1:#0d0d0d;--s2:#161616;--s3:#1f1f1f;--ln:rgba(255,255,255,.11);--ln2:rgba(255,255,255,.24);--tx:#f4f4f4;--mu:#9b9b9b;--head:'Bricolage Grotesque','Helvetica Neue',Arial,sans-serif;--body:'Hanken Grotesk','Helvetica Neue',Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}body{background:var(--bg);color:var(--tx);font:13.5px/1.55 var(--body);font-variant-caps:small-caps;letter-spacing:.02em;display:flex;flex-direction:column;overflow:hidden}button,a{font:inherit;color:inherit}a{text-decoration:none}button{border:0;background:none;cursor:pointer}.top{height:52px;flex:none;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--ln);background:var(--s1)}.logo{display:flex;align-items:center;gap:8px;font:700 15px var(--head);letter-spacing:0}.logo svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.5}.name{max-width:42vw;color:var(--mu);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sp{flex:1}.mut{color:var(--mu);font-size:12px}.btn{display:inline-flex;align-items:center;gap:7px;padding:6px 13px;border:1px solid var(--ln2);border-radius:99px;font-weight:600;font-size:12px;white-space:nowrap}.btn:hover{border-color:#fff;background:var(--s2)}.solid{background:#fff;color:#000;border-color:#fff}.shell{flex:1;min-height:0;display:flex;flex-direction:column}.bar{height:42px;flex:none;display:flex;align-items:center;gap:9px;padding:0 14px;border-bottom:1px solid var(--ln);background:#080808}.bar .dot{width:8px;height:8px;border-radius:50%;background:#54d38a}.viewport{flex:1;min-height:0;padding:16px;overflow:auto;background:radial-gradient(circle,rgba(255,255,255,.07) 1px,transparent 1px) 0 0/22px 22px}.site{width:100%;min-height:100%;border:1px solid var(--ln2);border-radius:12px;overflow:hidden;background:#fff;box-shadow:0 24px 60px rgba(0,0,0,.5)}iframe{display:block;width:100%;height:100%;min-height:calc(100vh - 126px);border:0;background:#fff}.empty{min-height:calc(100vh - 126px);display:grid;place-items:center;text-align:center;padding:30px;background:var(--s1);color:var(--mu)}.empty b{display:block;color:#fff;font:700 20px var(--head);margin-bottom:8px;letter-spacing:0}.empty .btn{margin-top:16px}@media(max-width:700px){.top{gap:7px}.logo span{display:none}.name{max-width:30vw}.top .btn{padding:6px 9px}.viewport{padding:8px}.site{border-radius:8px}}
</style>
</head>
<body>
<header class="top">
  <a class="logo" href="index.html" aria-label="Nexora AI home"><svg viewBox="0 0 28 28"><path d="M14 2l11 6v12l-11 6L3 20V8z"/><path d="M14 2v24M3 8l22 12M25 8L3 20" opacity=".45"/></svg><span>Nexora AI</span></a>
  <span class="name" id="projectName">Hosted website</span>
  <span class="sp"></span>
  <a class="btn" href="builder.html">Builder</a>
  <a class="btn" href="editor.html?project=">Editor</a>
</header>
<main class="shell">
  <div class="bar"><span class="dot" aria-hidden="true"></span><span id="status">Loading…</span><span class="sp"></span><span class="mut">sandboxed</span></div>
  <div class="viewport"><div class="site" id="site"></div></div>
</main>
<script>
const firebaseReady=Boolean(window.firebase&&window.FIREBASE_CONFIG?.apiKey&&window.FIREBASE_CONFIG?.authDomain&&window.FIREBASE_CONFIG?.projectId&&window.FIREBASE_CONFIG?.appId);
if(firebaseReady&&!window.firebase.apps.length)window.firebase.initializeApp(window.FIREBASE_CONFIG);
const firestore=firebaseReady&&window.firebase.firestore?window.firebase.firestore():null;
const load=()=>{try{return JSON.parse(localStorage.getItem('nx_project'))}catch{return null}};
async function resolveProject(){
  const params=new URLSearchParams(location.search);
  const slug=params.get('site');
  if(slug){
    if(!firestore){$status('Firebase is not configured on this page.');return null}
    try{
      const doc=await firestore.collection('sites').doc(slug).get();
      if(doc.exists){const d=doc.data();return {id:slug,slug,name:d.name,files:d.files}}
      $status('This website could not be found.');
    }catch(err){console.warn('Could not load hosted site from Firestore',err);$status(err&&err.code==='permission-denied'?'Firestore security rules are blocking this read. See the setup guide.':'This website is temporarily unavailable.')}
    return null;
  }
  const id=params.get('project');
  if(id){const list=JSON.parse(localStorage.getItem('nx_projects')||'[]');const found=list.find(p=>p&&p.id===id);if(found)return found;}
  return load();
}
function $status(t){const el=document.querySelector('#status');if(el)el.textContent=t}
function combine(f){let h=f.html||'',css=false,js=false;h=h.replace(/<link[^>]+style\.css[^>]*>/i,()=>{css=true;return '<style>'+f.css+'</style>'});h=h.replace(/<script[^>]+src=["']script\.js["'][^>]*>\s*<\/script>/i,()=>{js=true;return '<script>'+f.js+'<\/script>'});if(!css&&f.css)h=/<\/head>/i.test(h)?h.replace(/<\/head>/i,'<style>'+f.css+'</style></head>'):'<style>'+f.css+'</style>'+h;if(!js&&f.js)h=/<\/body>/i.test(h)?h.replace(/<\/body>/i,'<script>'+f.js+'<\/script></body>'):h+'<script>'+f.js+'<\/script>';return h}
(async()=>{
  const project=await resolveProject(),site=document.querySelector('#site');
  const editorLink=document.querySelector('a[href="editor.html?project="]');if(project?.id&&!project.slug&&editorLink){editorLink.href='editor.html?project='+encodeURIComponent(project.id);}else if(editorLink){editorLink.href='editor.html';}
  document.querySelector('#projectName').textContent=project?.name||'Hosted website';
  if(project?.files?.html){$status(project.slug?'Published via Firebase':'Local preview');const frame=document.createElement('iframe');frame.title='Hosted website preview';frame.sandbox='allow-scripts allow-forms allow-modals';frame.srcdoc=combine(project.files);site.append(frame)}else{$status('Nothing hosted yet');site.innerHTML='<div class="empty"><div><b>No hosted website yet</b>Generate a website in Builder first.<br><a class="btn solid" href="builder.html">Open Builder</a></div></div>'}
})();
</script>
</body>
</html>
