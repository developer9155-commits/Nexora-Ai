<!doctype html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1"
>

<title>Hosted Website - Nexora AI</title>


<script>
(function(){

  var p =
    new URLSearchParams(
      location.search
    );

  /*
   * Public hosted websites do NOT require login.
   *
   * If there is no site/project parameter,
   * only then check the local login session.
   */

  if (
    p.get('site') ||
    p.get('project')
  ) {
    return;
  }

  try {

    if (
      JSON.parse(
        localStorage.getItem(
          'nx_session'
        )
      )?.provider !== 'firebase'
    ) {

      location.replace(
        'login.html?next=host.html'
      );

    }

  } catch {

    location.replace(
      'login.html?next=host.html'
    );

  }

})();
</script>


<!-- Firebase -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script src="firebase-config.js"></script>


<link
  href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Hanken+Grotesk:wght@400;500;600&display=swap"
  rel="stylesheet"
>


<style>

:root{
  --bg:#050505;
  --s1:#0d0d0d;
  --s2:#161616;
  --s3:#1f1f1f;
  --ln:rgba(255,255,255,.11);
  --ln2:rgba(255,255,255,.24);
  --tx:#f4f4f4;
  --mu:#9b9b9b;

  --head:
    'Bricolage Grotesque',
    'Helvetica Neue',
    Arial,
    sans-serif;

  --body:
    'Hanken Grotesk',
    'Helvetica Neue',
    Arial,
    sans-serif;
}


*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}


html,
body{
  height:100%;
}


body{
  background:var(--bg);
  color:var(--tx);

  font:
    13.5px/1.55
    var(--body);

  font-variant-caps:small-caps;
  letter-spacing:.02em;

  display:flex;
  flex-direction:column;

  overflow:hidden;
}


button,
a{
  font:inherit;
  color:inherit;
}


a{
  text-decoration:none;
}


button{
  border:0;
  background:none;
  cursor:pointer;
}


.top{
  height:52px;
  flex:none;

  display:flex;
  align-items:center;

  gap:10px;

  padding:0 14px;

  border-bottom:
    1px solid var(--ln);

  background:var(--s1);
}


.logo{
  display:flex;
  align-items:center;

  gap:8px;

  font:
    700 15px var(--head);

  letter-spacing:0;
}


.logo svg{
  width:22px;
  height:22px;

  fill:none;

  stroke:currentColor;

  stroke-width:1.5;
}


.name{
  max-width:42vw;

  color:var(--mu);

  font-weight:600;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}


.sp{
  flex:1;
}


.mut{
  color:var(--mu);
  font-size:12px;
}


.btn{
  display:inline-flex;

  align-items:center;

  gap:7px;

  padding:6px 13px;

  border:
    1px solid var(--ln2);

  border-radius:99px;

  font-weight:600;

  font-size:12px;

  white-space:nowrap;

  transition:
    background .2s,
    border-color .2s;
}


.btn:hover{
  border-color:#fff;
  background:var(--s2);
}


.solid{
  background:#fff;
  color:#000;

  border-color:#fff;
}


.solid:hover{
  background:#ddd;
}


.shell{
  flex:1;

  min-height:0;

  display:flex;
  flex-direction:column;
}


.bar{
  height:42px;
  flex:none;

  display:flex;
  align-items:center;

  gap:9px;

  padding:0 14px;

  border-bottom:
    1px solid var(--ln);

  background:#080808;
}


.bar .dot{
  width:8px;
  height:8px;

  border-radius:50%;

  background:#54d38a;
}


.bar .dot.error{
  background:#fff;
}


.viewport{
  flex:1;

  min-height:0;

  padding:16px;

  overflow:auto;

  background:

    radial-gradient(
      circle,
      rgba(255,255,255,.07) 1px,
      transparent 1px
    )

    0 0 / 22px 22px;
}


.site{
  width:100%;
  min-height:100%;

  border:
    1px solid var(--ln2);

  border-radius:12px;

  overflow:hidden;

  background:#fff;

  box-shadow:
    0 24px 60px rgba(0,0,0,.5);
}


iframe{
  display:block;

  width:100%;

  height:100%;

  min-height:
    calc(100vh - 126px);

  border:0;

  background:#fff;
}


.empty{
  min-height:
    calc(100vh - 126px);

  display:grid;

  place-items:center;

  text-align:center;

  padding:30px;

  background:var(--s1);

  color:var(--mu);
}


.empty b{
  display:block;

  color:#fff;

  font:
    700 20px var(--head);

  margin-bottom:8px;

  letter-spacing:0;
}


.empty .btn{
  margin-top:16px;
}


.loading{
  min-height:
    calc(100vh - 126px);

  display:grid;

  place-items:center;

  text-align:center;

  padding:30px;

  background:var(--s1);

  color:var(--mu);
}


.loading b{
  display:block;

  color:#fff;

  font:
    700 20px var(--head);

  margin-bottom:8px;

  letter-spacing:0;
}


@media(max-width:700px){

  .top{
    gap:7px;
  }


  .logo span{
    display:none;
  }


  .name{
    max-width:30vw;
  }


  .top .btn{
    padding:6px 9px;
  }


  .viewport{
    padding:8px;
  }


  .site{
    border-radius:8px;
  }

}

</style>

</head>


<body>


<header class="top">

  <a
    class="logo"
    href="index.html"
    aria-label="Nexora AI home"
  >

    <svg viewBox="0 0 28 28">

      <path
        d="M14 2l11 6v12l-11 6L3 20V8z"
      />

      <path
        d="M14 2v24M3 8l22 12M25 8L3 20"
        opacity=".45"
      />

    </svg>

    <span>Nexora AI</span>

  </a>


  <span
    class="name"
    id="projectName"
  >
    Hosted website
  </span>


  <span class="sp"></span>


  <a
    class="btn"
    href="builder.html"
  >
    Builder
  </a>


  <a
    class="btn"
    id="editorLink"
    href="editor.html"
  >
    Editor
  </a>

</header>


<main class="shell">


  <div class="bar">

    <span
      class="dot"
      id="statusDot"
      aria-hidden="true"
    ></span>


    <span id="status">
      Loading…
    </span>


    <span class="sp"></span>


    <span class="mut">
      sandboxed
    </span>

  </div>


  <div class="viewport">

    <div
      class="site"
      id="site"
    >

      <div class="loading">

        <div>

          <b>
            Loading website…
          </b>

          Please wait.

        </div>

      </div>

    </div>

  </div>

</main>


<script>

/* =========================================================
   FIREBASE INITIALIZATION
   ========================================================= */

const firebaseReady =
  Boolean(

    window.firebase &&

    window.FIREBASE_CONFIG?.apiKey &&

    window.FIREBASE_CONFIG?.authDomain &&

    window.FIREBASE_CONFIG?.projectId &&

    window.FIREBASE_CONFIG?.appId

  );


if (
  firebaseReady &&
  !window.firebase.apps.length
) {

  window.firebase.initializeApp(
    window.FIREBASE_CONFIG
  );

}


const firestore =
  firebaseReady &&
  window.firebase.firestore

    ? window.firebase.firestore()

    : null;


/* =========================================================
   DOM HELPERS
   ========================================================= */

function $(selector){

  return document.querySelector(
    selector
  );

}


function $status(text){

  const el =
    $('#status');

  if(el)
    el.textContent = text;

}


function setErrorStatus(){

  const dot =
    $('#statusDot');

  if(dot)
    dot.classList.add(
      'error'
    );

}


/* =========================================================
   LOCAL PROJECT
   ========================================================= */

function loadLocalProject(){

  try{

    return JSON.parse(

      localStorage.getItem(
        'nx_project'
      )

    );

  }catch{

    return null;

  }

}


/* =========================================================
   LOCAL PROJECT LIST
   ========================================================= */

function findLocalProject(id){

  try{

    const list =
      JSON.parse(

        localStorage.getItem(
          'nx_projects'
        ) || '[]'

      );


    return list.find(

      p =>
        p &&
        p.id === id

    ) || null;


  }catch{

    return null;

  }

}


/* =========================================================
   FIRESTORE HOSTED PROJECT
   ========================================================= */

async function loadHostedProject(slug){

  if(!firestore){

    throw Object.assign(

      new Error(
        'Firebase is not configured on this page.'
      ),

      {
        code:
          'firebase_not_configured'
      }

    );

  }


  const cleanSlug =
    String(
      slug || ''
    )
    .trim()
    .toLowerCase();


  if(!cleanSlug){

    throw Object.assign(

      new Error(
        'No website subdomain was provided.'
      ),

      {
        code:
          'invalid_slug'
      }

    );

  }


  /*
   * Only safe Firestore document IDs
   * are accepted.
   */

  if(
    !/^[a-z0-9][a-z0-9-]{0,39}$/.test(
      cleanSlug
    )
  ){

    throw Object.assign(

      new Error(
        'Invalid website subdomain.'
      ),

      {
        code:
          'invalid_slug'
      }

    );

  }


  const ref =
    firestore
      .collection('sites')
      .doc(cleanSlug);


  const doc =
    await ref.get();


  if(!doc.exists){

    throw Object.assign(

      new Error(
        'This website could not be found.'
      ),

      {
        code:
          'not_found'
      }

    );

  }


  const data =
    doc.data() || {};


  /*
   * Validate stored website files.
   */

  if(
    !data.files ||
    typeof data.files !== 'object'
  ){

    throw Object.assign(

      new Error(
        'This website has invalid or missing files.'
      ),

      {
        code:
          'invalid_site'
      }

    );

  }


  return {

    id:
      cleanSlug,

    slug:
      cleanSlug,

    name:
      typeof data.name === 'string' &&
      data.name.trim()

        ? data.name.trim()

        : 'Untitled website',

    visibility:
      data.visibility === 'private'
        ? 'private'
        : 'public',

    uid:
      data.uid || null,

    files: {

      html:
        typeof data.files.html === 'string'
          ? data.files.html
          : '',

      css:
        typeof data.files.css === 'string'
          ? data.files.css
          : '',

      js:
        typeof data.files.js === 'string'
          ? data.files.js
          : ''

    }

  };

}


/* =========================================================
   RESOLVE PROJECT
   ========================================================= */

async function resolveProject(){

  const params =
    new URLSearchParams(
      location.search
    );


  const slug =
    params.get('site');


  /* -------------------------------------------------------
     Published Firebase website
     ------------------------------------------------------- */

  if(slug){

    return await loadHostedProject(
      slug
    );

  }


  /* -------------------------------------------------------
     Local project
     ------------------------------------------------------- */

  const projectId =
    params.get('project');


  if(projectId){

    const found =
      findLocalProject(
        projectId
      );


    if(found)
      return found;


    throw Object.assign(

      new Error(
        'This local project could not be found.'
      ),

      {
        code:
          'not_found'
      }

    );

  }


  return loadLocalProject();

}


/* =========================================================
   COMBINE HTML + CSS + JS
   ========================================================= */

function combine(files){

  if(
    !files ||
    typeof files !== 'object'
  ){

    return '';

  }


  let html =
    files.html || '';

  const css =
    files.css || '';

  const js =
    files.js || '';


  let cssInjected =
    false;

  let jsInjected =
    false;


  /* -------------------------------------------------------
     Inject style.css
     ------------------------------------------------------- */

  html =
    html.replace(

      /<link[^>]+style\.css[^>]*>/i,

      () => {

        cssInjected =
          true;

        return (

          '<style>\n' +
          css +
          '\n</style>'

        );

      }

    );


  /* -------------------------------------------------------
     Inject script.js
     ------------------------------------------------------- */

  html =
    html.replace(

      /<script[^>]+src=["']script\.js["'][^>]*>\s*<\/script>/i,

      () => {

        jsInjected =
          true;

        return (

          '<script>\n' +
          js +
          '\n<\/script>'

        );

      }

    );


  /* -------------------------------------------------------
     CSS fallback
     ------------------------------------------------------- */

  if(
    !cssInjected &&
    css
  ){

    if(
      /<\/head>/i.test(
        html
      )
    ){

      html =
        html.replace(

          /<\/head>/i,

          '<style>\n' +
          css +
          '\n</style>' +
          '</head>'

        );

    }else{

      html =
        '<style>\n' +
        css +
        '\n</style>\n' +
        html;

    }

  }


  /* -------------------------------------------------------
     JavaScript fallback
     ------------------------------------------------------- */

  if(
    !jsInjected &&
    js
  ){

    if(
      /<\/body>/i.test(
        html
      )
    ){

      html =
        html.replace(

          /<\/body>/i,

          '<script>\n' +
          js +
          '\n<\/script>' +
          '</body>'

        );

    }else{

      html +=

        '\n<script>\n' +
        js +
        '\n<\/script>';

    }

  }


  return html;

}


/* =========================================================
   SHOW EMPTY STATE
   ========================================================= */

function showEmpty(
  title,
  message,
  buttonText = 'Open Builder',
  buttonHref = 'builder.html'
){

  const site =
    $('#site');


  site.innerHTML = '';


  const box =
    document.createElement(
      'div'
    );


  box.className =
    'empty';


  const content =
    document.createElement(
      'div'
    );


  const heading =
    document.createElement(
      'b'
    );


  heading.textContent =
    title;


  content.append(
    heading
  );


  content.append(
    document.createTextNode(
      message
    )
  );


  content.append(
    document.createElement(
      'br'
    )
  );


  const link =
    document.createElement(
      'a'
    );


  link.className =
    'btn solid';


  link.href =
    buttonHref;


  link.textContent =
    buttonText;


  content.append(
    link
  );


  box.append(
    content
  );


  site.append(
    box
  );

}


/* =========================================================
   SHOW ERROR
   ========================================================= */

function showError(
  title,
  message
){

  const site =
    $('#site');


  site.innerHTML = '';


  const box =
    document.createElement(
      'div'
    );


  box.className =
    'empty';


  const content =
    document.createElement(
      'div'
    );


  const heading =
    document.createElement(
      'b'
    );


  heading.textContent =
    title;


  content.append(
    heading
  );


  content.append(
    document.createTextNode(
      message
    )
  );


  content.append(
    document.createElement(
      'br'
    )
  );


  const link =
    document.createElement(
      'a'
    );


  link.className =
    'btn';


  link.href =
    'builder.html';


  link.textContent =
    'Back to Builder';


  content.append(
    link
  );


  box.append(
    content
  );


  site.append(
    box
  );


  setErrorStatus();

}


/* =========================================================
   OPEN WEBSITE
   ========================================================= */

(async function(){

  try{

    const project =
      await resolveProject();


    const site =
      $('#site');


    const editorLink =
      $('#editorLink');


    /* -----------------------------------------------------
       No project
       ----------------------------------------------------- */

    if(
      !project ||
      !project.files
    ){

      $status(
        'Nothing hosted yet'
      );


      showEmpty(

        'No hosted website yet',

        'Generate a website in Builder first.'

      );


      if(editorLink)
        editorLink.href =
          'editor.html';


      return;

    }


    /* -----------------------------------------------------
       Project name
       ----------------------------------------------------- */

    $('#projectName')
      .textContent =
        project.name ||
        'Hosted website';


    /* -----------------------------------------------------
       Editor link
       ----------------------------------------------------- */

    if(
      project.slug
    ){

      /*
       * A Firebase hosted website does not necessarily
       * exist as a local project anymore.
       *
       * Keep Editor available, but don't pretend that
       * the slug is the local project ID.
       */

      editorLink.href =
        'editor.html';

    }

    else if(
      project.id
    ){

      editorLink.href =
        'editor.html?project=' +
        encodeURIComponent(
          project.id
        );

    }

    else{

      editorLink.href =
        'editor.html';

    }


    /* -----------------------------------------------------
       Check HTML
       ----------------------------------------------------- */

    if(
      typeof project.files.html !==
      'string' ||
      !project.files.html.trim()
    ){

      $status(
        'Website has no HTML'
      );


      showError(

        'Invalid website',

        'The published website does not contain valid HTML.'

      );


      return;

    }


    /* -----------------------------------------------------
       Status
       ----------------------------------------------------- */

    $status(

      project.slug
        ? 'Published via Firebase'
        : 'Local preview'

    );


    /* -----------------------------------------------------
       Create sandboxed iframe
       ----------------------------------------------------- */

    const frame =
      document.createElement(
        'iframe'
      );


    frame.title =
      'Hosted website preview';


    /*
     * Keep the generated website isolated
     * from the Nexora AI parent page.
     */

    frame.sandbox =
      'allow-scripts allow-forms allow-modals';


    frame.referrerPolicy =
      'no-referrer';


    frame.srcdoc =
      combine(
        project.files
      );


    frame.addEventListener(
      'load',
      () => {

        $status(

          project.slug
            ? 'Website is live'
            : 'Local preview'

        );

      }
    );


    site.innerHTML =
      '';


    site.append(
      frame
    );


  }catch(error){

    console.error(
      'Hosted website loading error:',
      error
    );


    const code =
      error?.code;


    if(
      code ===
      'firebase_not_configured'
    ){

      $status(
        'Firebase configuration error'
      );


      showError(

        'Firebase is not configured',

        'Check your firebase-config.js configuration.'

      );


      return;

    }


    if(
      code ===
      'permission-denied'
    ){

      $status(
        'Access denied'
      );


      showError(

        'Website cannot be loaded',

        'Firestore Security Rules are blocking access to this website.'

      );


      return;

    }


    if(
      code ===
      'not_found'
    ){

      $status(
        'Website not found'
      );


      showError(

        'Website not found',

        'The requested website does not exist or has been removed.'

      );


      return;

    }


    if(
      code ===
      'invalid_slug'
    ){

      $status(
        'Invalid website address'
      );


      showError(

        'Invalid website address',

        'The website subdomain is not valid.'

      );


      return;

    }


    if(
      code ===
      'invalid_site'
    ){

      $status(
        'Invalid website'
      );


      showError(

        'Invalid website',

        'The published website data is incomplete.'

      );


      return;

    }


    $status(
      'Website unavailable'
    );


    showError(

      'Website temporarily unavailable',

      error?.message ||
      'An unexpected error occurred while loading the website.'

    );

  }

})();

</script>

</body>
</html>
