<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign In - Nexora AI</title>
<link rel="icon" type="image/png" href="images/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script src="emailjs-config.js"></script>
<style>
 :root{--bg:#050505;--s1:#0d0d0d;--s2:#161616;--s3:#1f1f1f;--ln:rgba(255,255,255,.11);--ln2:rgba(255,255,255,.24);--tx:#f4f4f4;--mu:#9b9b9b;--dim:#686868;--head:'Bricolage Grotesque','Helvetica Neue',Arial,sans-serif;--body:'Hanken Grotesk','Helvetica Neue',Arial,sans-serif;--ok:#62d99c;--bad:#ff8e8e}
*{box-sizing:border-box;margin:0;padding:0}html,body{min-height:100%;font-family:var(--body);overflow-x:hidden}body{background:var(--bg);color:var(--tx);font-size:14px;line-height:1.5;font-variant-caps:small-caps;letter-spacing:.02em;-webkit-font-smoothing:antialiased;max-width:100vw}button,input{font:inherit;color:inherit;letter-spacing:inherit}button{border:0;background:none;cursor:pointer}a{color:inherit;text-decoration:none}.top{height:62px;display:flex;align-items:center;gap:10px;padding:0 24px;border-bottom:1px solid var(--ln);background:rgba(13,13,13,.9)}.logo{display:flex;align-items:center;gap:9px;font:700 16px var(--head);letter-spacing:0}.logo svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.5}.sp{flex:1}.back{color:var(--mu);font-size:12px}.back:hover{color:#fff}.page{min-height:calc(100vh - 62px);display:grid;grid-template-columns:minmax(0,1.05fr) minmax(380px,.95fr);align-items:center;gap:7vw;max-width:1180px;margin:auto;padding:60px 42px;position:relative;overflow:hidden}.page:before,.page:after{content:'';position:absolute;pointer-events:none;border:1px solid rgba(255,255,255,.08);transform:rotate(45deg)}.page:before{width:360px;height:360px;left:-210px;top:18%;border-radius:42px}.page:after{width:230px;height:230px;right:-120px;bottom:8%;border-radius:34px}.card{grid-column:2;max-width:520px;width:min(100%,520px);margin:0 auto;padding:26px;border:1px solid var(--ln2);border-radius:22px;background:linear-gradient(180deg,var(--s2),var(--s1));box-shadow:0 32px 60px rgba(0,0,0,.5)}

/* small 3d cube, decorative */
.cube-slot{grid-column:1;display:flex;align-items:center;justify-content:center}
.cube-scene{width:96px;height:96px;perspective:480px}
.cube{position:relative;width:100%;height:100%;transform-style:preserve-3d;animation:spin 11s linear infinite}
.cube .face{position:absolute;width:96px;height:96px;border:1px solid var(--ln2);background:linear-gradient(160deg,rgba(255,255,255,.14),rgba(255,255,255,.02));border-radius:10px;backdrop-filter:blur(1px)}
.cube .front{transform:translateZ(48px)}
.cube .back{transform:rotateY(180deg) translateZ(48px)}
.cube .right{transform:rotateY(90deg) translateZ(48px)}
.cube .left{transform:rotateY(-90deg) translateZ(48px)}
.cube .top{transform:rotateX(90deg) translateZ(48px);background:linear-gradient(160deg,rgba(255,255,255,.22),rgba(255,255,255,.04))}
.cube .bottom{transform:rotateX(-90deg) translateZ(48px)}
@keyframes spin{from{transform:rotateX(-24deg) rotateY(0)}to{transform:rotateX(-24deg) rotateY(360deg)}}
@media (prefers-reduced-motion:reduce){.cube{animation:none;transform:rotateX(-24deg) rotateY(28deg)}}.tabs{display:flex;gap:10px;margin-top:18px}.tabs button{flex:1;padding:10px 12px;border-radius:12px;border:1px solid var(--ln2);background:rgba(255,255,255,.02);color:var(--mu);font-weight:700}.tabs button.active{background:#fff;color:#050505;border-color:#fff}.field{display:flex;flex-direction:column;gap:8px;margin-top:16px}.field label{font-size:12px;color:var(--mu)}.field input,.password input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--ln2);background:var(--s1);color:var(--tx);outline:none}.field input:focus,.password input:focus{border-color:#fff;box-shadow:0 0 0 1px rgba(255,255,255,.12)}.password{display:flex;align-items:center;gap:8px;border:1px solid var(--ln2);border-radius:12px;background:var(--s1);padding-right:10px}.password input{border:0;background:transparent}.show{color:var(--tx);font-weight:700;padding:8px 10px;border-radius:8px}.sub{color:var(--mu);margin-top:8px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:16px}.check{display:flex;align-items:center;gap:8px;color:var(--mu);font-size:12px}.link{color:var(--mu);font-size:12px}.message{min-height:22px;margin-top:16px;font-size:12px;color:var(--bad)}.message.ok{color:var(--ok)}.submit,.google{display:flex;align-items:center;justify-content:center;width:100%;padding:12px 16px;border-radius:12px;font-weight:700;margin-top:18px;border:1px solid var(--ln2)}.submit{background:#fff;color:#050505;border-color:#fff}.google{background:var(--s2);color:var(--tx)}.google span{display:inline-grid;place-items:center;width:20px;height:20px;margin-right:8px;border-radius:50%;background:#fff;color:#4285f4;font:700 14px Arial}.demo,.legal{margin-top:14px;color:var(--mu);font-size:12px;text-align:center}.legal a{color:#fff}.signup-only{display:none}.hidden{display:none !important}

@media (max-width:900px){
  .page{grid-template-columns:1fr;gap:32px;padding:40px 28px}
  .cube-slot{grid-column:1;order:-1}
  .cube-scene{width:72px;height:72px}
  .cube .face{width:72px;height:72px}
  .cube .front,.cube .back,.cube .right,.cube .left,.cube .top,.cube .bottom{transform-origin:center}
  .cube .front{transform:translateZ(36px)}
  .cube .back{transform:rotateY(180deg) translateZ(36px)}
  .cube .right{transform:rotateY(90deg) translateZ(36px)}
  .cube .left{transform:rotateY(-90deg) translateZ(36px)}
  .cube .top{transform:rotateX(90deg) translateZ(36px)}
  .cube .bottom{transform:rotateX(-90deg) translateZ(36px)}
  .card{grid-column:1}
  .page:before{width:220px;height:220px;left:-140px;top:6%}
  .page:after{width:160px;height:160px;right:-90px;bottom:4%}
}

@media (max-width:520px){
  .top{padding:0 16px}
  .logo{font-size:14px}
  .back{font-size:11px}
  .page{padding:28px 16px 40px;min-height:auto}
  .card{padding:20px;border-radius:18px}
  .cube-scene{width:56px;height:56px}
  .cube .face{width:56px;height:56px}
  .cube .front{transform:translateZ(28px)}
  .cube .back{transform:rotateY(180deg) translateZ(28px)}
  .cube .right{transform:rotateY(90deg) translateZ(28px)}
  .cube .left{transform:rotateY(-90deg) translateZ(28px)}
  .cube .top{transform:rotateX(90deg) translateZ(28px)}
  .cube .bottom{transform:rotateX(-90deg) translateZ(28px)}
  .tabs{gap:8px}
  .tabs button{padding:9px 8px;font-size:12px}
  .row{flex-wrap:wrap;gap:8px}
  .page:before,.page:after{display:none}
}
</style>
</head>
<body>
<header class="top"><a class="logo" href="index.html" aria-label="Nexora AI home"><svg viewBox="0 0 28 28"><path d="M14 2l11 6v12l-11 6L3 20V8z"/><path d="M14 2v24M3 8l22 12M25 8L3 20" opacity=".45"/></svg><span>Nexora AI</span></a><span class="sp"></span><a class="back" href="index.html">Back to home</a></header>
<main class="page">
<div class="cube-slot" aria-hidden="true">
  <div class="cube-scene">
    <div class="cube">
      <div class="face front"></div>
      <div class="face back"></div>
      <div class="face right"></div>
      <div class="face left"></div>
      <div class="face top"></div>
      <div class="face bottom"></div>
    </div>
  </div>
</div>
<section class="card" aria-label="Account access">
  <h2 id="title">Welcome back</h2>
  <p class="sub" id="subtitle">Sign in to open your workspace.</p>
  <div class="tabs" role="tablist">
    <button class="active" id="signinTab" role="tab" aria-selected="true" type="button">Sign in</button>
    <button id="signupTab" role="tab" aria-selected="false" type="button">Create account</button>
  </div>

  <form class="form" id="authForm" novalidate>
    <div class="field signup-only" id="nameField">
      <label for="name">Your name</label>
      <input id="name" autocomplete="name" placeholder="Alex Morgan">
    </div>

    <div class="field">
      <label for="email">Email address</label>
      <input id="email" type="email" autocomplete="email" placeholder="you@example.com">
    </div>

    <div class="field">
      <label for="password">Password</label>
      <div class="password">
        <input id="password" type="password" autocomplete="current-password" placeholder="At least 6 characters">
        <button class="show" type="button" id="showPassword">Show</button>
      </div>
    </div>

    <div class="row" id="signinOptions">
      <label class="check"><input type="checkbox" id="remember"> Remember me</label>
      <button class="link" type="button" id="forgot">Forgot password?</button>
    </div>

    <div class="message" id="message" role="status"></div>
    <button class="submit" id="submit" type="submit">Sign in</button>
    <button class="google" id="googleSignIn" type="button"><span>G</span> Continue with Google</button>
  </form>

  <p class="demo">Firebase Authentication protects your account.</p>
  <p class="legal">By continuing, you agree to our <a href="index.html">workspace terms</a>.</p>
</section>
</main>

<script>
const $ = (selector) => document.querySelector(selector);
const sessionKey = 'nx_session';
const ADMIN_EMAIL = (window.ADMIN_EMAIL && String(window.ADMIN_EMAIL).trim()) || 'developer8709@gmail.com';
const nextUrl = new URLSearchParams(location.search).get('next');
const destination = nextUrl && /^(builder|editor|host|admin)\.html(?:\?|$)/.test(nextUrl) ? nextUrl : 'builder.html';
let mode = 'signin';

const firebaseConfig = window.FIREBASE_CONFIG || {};
const firebaseConfigured = Boolean(
  firebaseConfig.apiKey &&
  !firebaseConfig.apiKey.startsWith('PASTE_') &&
  firebaseConfig.authDomain &&
  firebaseConfig.projectId &&
  firebaseConfig.appId
);

if (firebaseConfigured && window.firebase) {
  firebase.initializeApp(firebaseConfig);
}

const auth = firebaseConfigured && window.firebase ? firebase.auth() : null;
const provider = firebaseConfigured && window.firebase ? new firebase.auth.GoogleAuthProvider() : null;
const firestore = firebaseConfigured && window.firebase ? firebase.firestore() : null;

function isAdminEmail(email) {
  return String(email || '').trim().toLowerCase() === ADMIN_EMAIL.toLowerCase();
}

const emailjsConfig = window.EMAILJS_CONFIG || {};
const emailjsConfigured = Boolean(
  window.emailjs &&
  emailjsConfig.publicKey && !emailjsConfig.publicKey.startsWith('YOUR_') &&
  emailjsConfig.serviceId && !emailjsConfig.serviceId.startsWith('YOUR_') &&
  emailjsConfig.templateId && !emailjsConfig.templateId.startsWith('YOUR_')
);
if (emailjsConfigured) {
  emailjs.init({ publicKey: emailjsConfig.publicKey });
}

// Sends the Nexora AI welcome email after a new account is created.
// The error is re-thrown so the UI and browser console clearly show when EmailJS fails.
async function sendAccountCreatedEmail(email, name) {
  if (!emailjsConfigured) {
    throw new Error('EmailJS is not configured. Check emailjs-config.js.');
  }

  const templateParams = {
    to_email: String(email || '').trim(),
    to_name: String(name || 'there').trim(),
    app_name: 'Nexora AI',
    login_url: new URL('login.html', window.location.href).href,
    time: new Date().toLocaleString()
  };

  console.log('Nexora AI: sending welcome email...', templateParams);

  try {
    const response = await emailjs.send(
      emailjsConfig.serviceId,
      emailjsConfig.templateId,
      templateParams
    );

    console.log('Nexora AI: welcome email sent:', response.status, response.text);
    return response;
  } catch (error) {
    console.error('Nexora AI EmailJS error:', error);
    console.error('EmailJS status:', error && error.status);
    console.error('EmailJS message:', error && error.text);
    throw error;
  }
}

function setSession(user) {
  const email = String(user.email || $('#email').value || '').trim().toLowerCase();
  const name = user.displayName || $('#name').value.trim() || 'User';
  localStorage.setItem(sessionKey, JSON.stringify({
    provider: 'firebase',
    uid: user.uid,
    email,
    name,
    role: isAdminEmail(email) ? 'admin' : 'user'
  }));
}

async function saveUserProfile(user) {
  if (!firestore) throw new Error('Firestore is not configured on this page.');
  await firestore.collection('users').doc(user.uid).set({
    uid: user.uid,
    email: String(user.email || '').trim().toLowerCase(),
    displayName: user.displayName || $('#name').value.trim() || 'User',
    photoURL: user.photoURL || null,
    lastLoginAt: firebase.firestore.FieldValue.serverTimestamp(),
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  }, { merge: true });
}

function clearSession() {
  localStorage.removeItem(sessionKey);
}

function authError(error) {
  const messages = {
    'auth/invalid-email': 'Enter a valid email address.',
    'auth/user-not-found': 'No account exists for this email.',
    'auth/wrong-password': 'Email or password is incorrect.',
    'auth/invalid-credential': 'Email or password is incorrect.',
    'auth/email-already-in-use': 'An account with this email already exists.',
    'auth/weak-password': 'Password must be at least 6 characters.',
    'auth/popup-closed-by-user': 'Google sign-in was cancelled.',
    'auth/operation-not-allowed': 'Enable this sign-in provider in Firebase Console.'
  };
  return messages[error.code] || error.message || 'Authentication failed. Please try again.';
}

function setMessage(text, ok = false) {
  const el = $('#message');
  el.textContent = text;
  el.className = 'message' + (ok ? ' ok' : '');
}

function setMode(next) {
  mode = next;
  const signup = next === 'signup';
  $('#signinTab').classList.toggle('active', !signup);
  $('#signupTab').classList.toggle('active', signup);
  $('#signinTab').setAttribute('aria-selected', String(!signup));
  $('#signupTab').setAttribute('aria-selected', String(signup));
  $('#title').textContent = signup ? 'Create your account' : 'Welcome back';
  $('#subtitle').textContent = signup ? 'Start your free website workspace.' : 'Sign in to open your workspace.';
  $('#nameField').style.display = signup ? 'block' : 'none';
  $('#signinOptions').style.display = signup ? 'none' : 'flex';
  $('#submit').textContent = signup ? 'Create account' : 'Sign in';
  $('#password').autocomplete = signup ? 'new-password' : 'current-password';
  setMessage('');
}

function redirectAfterAuth(email) {
  const target = isAdminEmail(email) ? 'admin.html' : destination;
  location.href = target;
}

if (auth) {
  auth.onAuthStateChanged((user) => {
    if (user && user.emailVerified) {
      setSession(user);
    }
  });
}

$('#signinTab').onclick = () => setMode('signin');
$('#signupTab').onclick = () => setMode('signup');
$('#showPassword').onclick = () => {
  const input = $('#password');
  const visible = input.type === 'text';
  input.type = visible ? 'password' : 'text';
  $('#showPassword').textContent = visible ? 'Show' : 'Hide';
};

$('#forgot').onclick = async () => {
  if (!firebaseConfigured || !auth) {
    return setMessage('Add your Firebase web config in login.html first.');
  }
  const email = $('#email').value.trim().toLowerCase();
  if (!/^\S+@\S+\.\S+$/.test(email)) {
    return setMessage('Enter your email address first.');
  }
  try {
    await auth.sendPasswordResetEmail(email);
    setMessage('Password reset email sent. Check your inbox.', true);
  } catch (error) {
    setMessage(authError(error));
  }
};

$('#authForm').onsubmit = async (event) => {
  event.preventDefault();
  if (!firebaseConfigured || !auth) {
    return setMessage('Add your Firebase web config in login.html first.');
  }

  const email = $('#email').value.trim().toLowerCase();
  const password = $('#password').value;
  const name = $('#name').value.trim();

  if (!email || !/^\S+@\S+\.\S+$/.test(email)) {
    return setMessage('Enter a valid email address.');
  }
  if (password.length < 6) {
    return setMessage('Password must be at least 6 characters.');
  }

  try {
    await auth.setPersistence($('#remember').checked ? firebase.auth.Auth.Persistence.LOCAL : firebase.auth.Auth.Persistence.SESSION);

    if (mode === 'signup') {
      if (!name) {
        return setMessage('Enter your name.');
      }
      const credential = await auth.createUserWithEmailAndPassword(email, password);
      await credential.user.updateProfile({ displayName: name });
      await credential.user.sendEmailVerification();

      // Save the profile separately so a Firestore rules/network issue does not
      // prevent the welcome email from being sent.
      try {
        await saveUserProfile(credential.user);
      } catch (profileError) {
        console.error('Firestore profile save failed:', profileError);
      }

      try {
        await sendAccountCreatedEmail(email, name);
      } catch (emailError) {
        console.error('Welcome email failed:', emailError);
        setMessage(
          'Account created, but the welcome email could not be sent. Check the browser console.',
          false
        );
        try { await auth.signOut(); } catch (error) { console.warn('Logout after sign-up failed:', error); }
        clearSession();
        return;
      }

      setMessage(
        isAdminEmail(email)
          ? 'Admin account created. Verify your email, then sign in to open the admin dashboard.'
          : 'Account created. Check your inbox to verify your email before signing in.',
        true
      );
      try { await auth.signOut(); } catch (error) { console.warn('Logout after sign-up failed:', error); }
      clearSession();
      return;
    }

    const credential = await auth.signInWithEmailAndPassword(email, password);
    if (!credential.user.emailVerified) {
      await auth.signOut();
      clearSession();
      return setMessage('Please verify your email before signing in. Check your inbox.');
    }

    await saveUserProfile(credential.user);
    setSession(credential.user);
    setMessage('Signed in. Opening your workspace...', true);
    setTimeout(() => redirectAfterAuth(email), 450);
  } catch (error) {
    setMessage(authError(error));
  }
};

$('#googleSignIn').onclick = async () => {
  if (!firebaseConfigured || !auth || !provider) {
    return setMessage('Add your Firebase web config in login.html first.');
  }

  try {
    await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
    const result = await auth.signInWithPopup(provider);
    const email = String(result.user.email || '').toLowerCase();
    try {
      await saveUserProfile(result.user);
    } catch (profileError) {
      console.error('Firestore profile save failed:', profileError);
    }

    if (result.additionalUserInfo && result.additionalUserInfo.isNewUser) {
      try {
        await sendAccountCreatedEmail(email, result.user.displayName);
      } catch (emailError) {
        console.error('Google signup welcome email failed:', emailError);
      }
    }
    setSession(result.user);
    setMessage('Signed in with Google. Opening your workspace...', true);
    setTimeout(() => redirectAfterAuth(email), 450);
  } catch (error) {
    setMessage(authError(error));
  }
};
</script>
</body>
</html>
