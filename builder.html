<style>

<script>
/* Nexora AI — shared helpers. Website generation calls the Nexora backend proxy (which calls Gemini); hosting saves to Firebase (Firestore). */
const NX=(()=>{
const CFG={
  BRAND:'Nexora AI',
  /* Set this to your deployed backend's /generate URL, e.g. https://nexora-ai-proxy.onrender.com/generate (Render) or https://nexora-ai-proxy.up.railway.app/generate (Railway) */
  BACKEND_ENDPOINT:'https://nexora-ai-backend-l17c.onrender.com/generate'
};
const firebaseReady=Boolean(window.firebase&&window.FIREBASE_CONFIG?.apiKey&&window.FIREBASE_CONFIG?.authDomain&&window.FIREBASE_CONFIG?.projectId&&window.FIREBASE_CONFIG?.appId);
if(firebaseReady&&!window.firebase.apps.length)window.firebase.initializeApp(window.FIREBASE_CONFIG);
const firebaseAuthReady=firebaseReady?new Promise(resolve=>{
  const unsubscribe=window.firebase.auth().onAuthStateChanged(user=>{unsubscribe();resolve(user)});
}):Promise.resolve(null);
const firestore=firebaseReady&&window.firebase.firestore?window.firebase.firestore():null;
function buildPrompt(prompt,files){
  const rules='You are Nexora AI, an expert web developer. Generate a complete, modern, responsive single-page website.\n'+
  'Respond ONLY with a JSON object shaped like {"html":"...","css":"...","js":"...","message":"..."} and nothing else - no markdown fences, no commentary outside the JSON.\n'+
  '"html" must be a full <!doctype html> document with <head> and <body>. Inside <head> include exactly one <link rel="stylesheet" href="style.css"> and no other <style> tags. Just before the closing body tag include exactly one <script src="script.js"><\/script> tag and no other inline <script> tags.\n'+
  '"css" holds every CSS rule for style.css. "js" holds all vanilla JavaScript for script.js - no frameworks, no external libraries, no network calls.\n'+
  'Never reference external images or assets that may not exist - use CSS gradients, shapes, emoji or inline SVG instead.\n'+
  '"message" is one or two short, friendly sentences describing what you built, written to the end user.';
  let user='Request: '+prompt;
  if(files&&files.html){
    user='The user already has a website with these files.\n\n--- current index.html ---\n'+files.html+'\n\n--- current style.css ---\n'+(files.css||'')+'\n\n--- current script.js ---\n'+(files.js||'')+'\n\nApply this change and return the COMPLETE updated files (not a diff): '+prompt;
  }
  return {rules,user};
}
async function generate(prompt,files){
  const {rules,user}=buildPrompt(prompt,files);
  const userAccount=await firebaseAuthReady;
  if(!userAccount)throw Object.assign(new Error('Please sign in with Firebase before generating a website.'),{status:401});
  const idToken=await userAccount.getIdToken();
  const headers={'Content-Type':'application/json','Authorization':'Bearer '+idToken};
  const r=await fetch(CFG.BACKEND_ENDPOINT,{method:'POST',headers,body:JSON.stringify({system:rules,prompt:user})});
  let j=null;try{j=await r.json()}catch{}
  if(!r.ok)throw Object.assign(new Error((j&&j.error)||'Generation request failed ('+r.status+')'),{status:r.status});
  const out=j&&j.result;
  if(!out||typeof out.html!=='string')throw new Error('The AI returned an unusable response. Try again.');
  return out;
}
function slugify(s){return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)}
async function publish(p,slug,visibility){
  if(!firestore)throw Object.assign(new Error('Firebase is not configured on this page.'),{code:'firebase_not_configured'});
  const user=await firebaseAuthReady;
  const ref=firestore.collection('sites').doc(slug);
  const snap=await ref.get();
  if(snap.exists&&(!user||(snap.data().uid&&snap.data().uid!==user.uid)))throw new Error('That subdomain is already taken. Choose another.');
  await ref.set({
    uid:user?user.uid:null,
    name:p.name||'Untitled website',
    files:p.files,
    visibility:visibility||'public',
    updatedAt:firebase.firestore.FieldValue.serverTimestamp()
  });
  return new URL('host.html?site='+encodeURIComponent(slug),location.href).href;
}
const load=()=>{try{return JSON.parse(localStorage.getItem('nx_project'))}catch{return null}};
const save=p=>{p.updatedAt=Date.now();localStorage.setItem('nx_project',JSON.stringify(p));return p};
function el(t,a={},...k){const e=document.createElement(t);for(const[n,v]of Object.entries(a)){n==='class'?e.className=v:n.startsWith('on')?e.addEventListener(n.slice(2),v):e.setAttribute(n,v)}e.append(...k);return e}
function toast(m){const t=el('div',{class:'toast',role:'status'},m);document.body.append(t);setTimeout(()=>t.remove(),2200)}
function combine(f){let h=f.html||'',c=false,s=false;
  if(!/<meta[^>]+name=["']viewport["'][^>]*>/i.test(h)){
    const vp='<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">';
    h=/<\/head>/i.test(h)?h.replace(/<\/head>/i,vp+'</head>'):vp+h;
  }
  h=h.replace(/<link[^>]+style\.css[^>]*>/i,()=>(c=true,'<style>'+f.css+'</style>'));
  h=h.replace(/<script[^>]+src=["']script\.js["'][^>]*>\s*<\/script>/i,()=>(s=true,'<script>'+f.js+'<\/script>'));
  if(!c&&f.css)h=/<\/head>/i.test(h)?h.replace(/<\/head>/i,'<style>'+f.css+'</style></head>'):'<style>'+f.css+'</style>'+h;
  if(!s&&f.js)h=/<\/body>/i.test(h)?h.replace(/<\/body>/i,'<script>'+f.js+'<\/script></body>'):h+'<script>'+f.js+'<\/script>';
  return h}
const T=new Uint32Array(256).map((_,n)=>{for(let k=0;k<8;k++)n=n&1?0xEDB88320^(n>>>1):n>>>1;return n>>>0});
const crc=b=>{let c=~0;for(const x of b)c=T[(c^x)&255]^(c>>>8);return ~c>>>0};
function zip(files){const en=new TextEncoder(),parts=[],cd=[];let off=0,cs=0;const n=Object.keys(files).length;
  for(const[name,txt]of Object.entries(files)){const nb=en.encode(name),d=en.encode(txt),c=crc(d);
    const l=new DataView(new ArrayBuffer(30));l.setUint32(0,0x04034b50,true);l.setUint16(4,20,true);l.setUint32(14,c,true);l.setUint32(18,d.length,true);l.setUint32(22,d.length,true);l.setUint16(26,nb.length,true);
    const h=new DataView(new ArrayBuffer(46));h.setUint32(0,0x02014b50,true);h.setUint16(4,20,true);h.setUint16(6,20,true);h.setUint32(16,c,true);h.setUint32(20,d.length,true);h.setUint32(24,d.length,true);h.setUint16(28,nb.length,true);h.setUint32(42,off,true);
    parts.push(l,nb,d);cd.push(h,nb);off+=30+nb.length+d.length;cs+=46+nb.length}
  const e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,n,true);e.setUint16(10,n,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);
  return new Blob([...parts,...cd,e],{type:'application/zip'})}
function download(blob,name){const a=el('a',{href:URL.createObjectURL(blob),download:name});document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1e3)}
function downloadProject(p){const f=p.files;download(zip({'index.html':f.html,'style.css':f.css,'script.js':f.js}),(p.name||'website').replace(/[^\w-]+/g,'-')+'.zip')}
function modal(...k){const d=el('dialog',{},...k);d.addEventListener('click',e=>{if(e.target===d)d.close()});d.addEventListener('close',()=>d.remove());document.body.append(d);d.showModal();return d}
function host(p){
  const nm=el('input',{value:p.name||'',maxlength:60}),sd=el('input',{value:p.slug||slugify(p.name||''),maxlength:40,placeholder:'my-website'});
  const vis=el('select',{},el('option',{value:'public'},'Public'),el('option',{value:'private'},'Private'));
  const st=el('p',{class:'st',role:'status'}),body=el('div'),go=el('button',{class:'btn solid'},'Deploy');let d;
  const lab=(t,i)=>el('label',{},t,i);
  body.append(lab('Website name',nm),lab('Subdomain',sd),lab('Visibility',vis),lab('Custom domain (coming later)',el('input',{disabled:'',placeholder:'Not available yet'})),st,
    el('div',{class:'ac'},el('button',{class:'btn',onclick:()=>d.close()},'Close'),go));
  go.onclick=async()=>{
    const finalSlug=slugify(sd.value);
    if(!finalSlug){st.textContent='Enter a subdomain using letters and numbers.';return}
    if(!p.files){st.textContent='Generate a website first, then host it.';return}
    go.disabled=true;st.textContent='Publishing website…';
    try{
      p.name=nm.value.trim()||p.name;
      const url=await publish(p,finalSlug,vis.value);
      p.deploymentUrl=url;p.status='published';p.slug=finalSlug;save(p);
      body.replaceChildren(el('h3',{},'Your website is live!'),el('p',{class:'st'},'Opening '+url+' …'),
        el('div',{class:'ac'},el('button',{class:'btn',onclick:()=>navigator.clipboard.writeText(url).then(()=>toast('URL copied'))},'Copy URL'),
        el('a',{class:'btn solid',href:url,target:'_blank',rel:'noopener'},'Visit Website')));
      setTimeout(()=>{location.href=url},900);
    }catch(e){st.textContent='Publishing failed: '+(e.code==='firebase_not_configured'?'Firebase is not configured on this page.':e.message);go.disabled=false}};
  d=modal(el('h3',{},'Host project'),el('p',{class:'mut'},'Your website is published to Firebase and served from Nexora AI hosting.'),body)}

<script>
const {el,$}=NX;
document.querySelectorAll('[data-brand]').forEach(n=>n.textContent=NX.CFG.BRAND);
const MAX=2000,STEPS=['Understanding request','Generating code','Preparing preview','Ready'];
const projectListKey='nx_projects';
const resolveProject=()=>{const params=new URLSearchParams(location.search);const id=params.get('project');if(id){const list=JSON.parse(localStorage.getItem(projectListKey)||'[]');const match=list.find(item=>item&&item.id===id);if(match)return match;}const stored=NX.load();if(stored&&stored.id)return stored;return {id:'project-'+Date.now(),name:'Untitled website',prompt:'',files:null,messages:[],status:'draft'};};
const syncProjectList=(project)=>{const list=JSON.parse(localStorage.getItem(projectListKey)||'[]').filter(Boolean);const cleaned=list.filter(item=>item && item.id!==project.id);cleaned.unshift(project);localStorage.setItem(projectListKey,JSON.stringify(cleaned.slice(0,30)));localStorage.setItem('nx_project',JSON.stringify(project));};
const saveProject=(project)=>{project.updatedAt=Date.now();const saved=NX.save(project);syncProjectList(saved);return saved;};
const p=resolveProject();p.messages=p.messages||[];p.id=p.id||'project-'+Date.now();
const hasSession=()=>{try{return !!JSON.parse(localStorage.getItem('nx_session'))}catch{return false}};
const getSession=()=>{try{return JSON.parse(localStorage.getItem('nx_session'))||null}catch{return null}};
const loginModal=document.createElement('div');
loginModal.className='login-modal-backdrop';
loginModal.innerHTML='<div class="login-modal" role="dialog" aria-modal="true" aria-labelledby="loginFirstTitle"><div class="login-modal-icon">!</div><h3 id="loginFirstTitle">Login First</h3><p>Please sign in to continue building your website.</p><div class="login-modal-actions"><button class="btn" type="button" id="loginModalClose">Close</button><a class="btn solid" id="loginModalGo" href="login.html">Sign In</a></div></div>';
document.body.appendChild(loginModal);
const showLoginFirst=(target='builder.html')=>{const link=loginModal.querySelector('#loginModalGo');link.href='login.html?next='+encodeURIComponent(target||'builder.html');loginModal.classList.add('show');};
const hideLoginFirst=()=>loginModal.classList.remove('show');
loginModal.addEventListener('click',e=>{if(e.target===loginModal)hideLoginFirst();});
loginModal.querySelector('#loginModalClose').addEventListener('click',hideLoginFirst);
const showUserChip=()=>{const session=getSession();const chip=document.getElementById('userChip');const avatar=document.getElementById('userAvatar');const label=document.getElementById('userLabel');const logoutBtn=document.getElementById('logoutBtn');const userToggle=document.getElementById('userToggle');if(!session){chip.classList.add('hidden');return;}const name=session.name||session.email||'User';const short=(name.trim().split(' ')[0]||'U').charAt(0).toUpperCase();avatar.textContent=short;label.textContent=name;chip.classList.remove('hidden');logoutBtn.classList.remove('visible');logoutBtn.onclick=()=>{localStorage.removeItem('nx_session');location.reload();};userToggle.onclick=()=>{logoutBtn.classList.toggle('visible');};};
showUserChip();

let busy=false;

const persist=()=>{saveProject(p);$('#saved').textContent='Saved locally'};
function add(m){p.messages.push(m);p.messages=p.messages.slice(-40);persist();render()}
function render(){msgs.replaceChildren();
  msgs.append(el('div',{class:'m'},'Hi! Describe the website you want and I\'ll write the HTML, CSS and JavaScript.',
    el('div',{class:'chips'},...['Create a modern portfolio website for a photographer','Build a landing page for a startup','Create a restaurant website'].map(t=>el('button',{onclick:()=>{ta.value=t;count();ta.focus()}},t)))));
  p.messages.forEach((m,i)=>{const d=el('div',{class:'m '+m.r},m.t);
    if(m.r==='e'&&i===p.messages.length-1&&m.retry)d.append(el('div',{class:'ac'},el('button',{class:'btn',onclick:()=>{p.messages.pop();run(m.retry,true)}},'Retry')));
    if(m.done&&i===p.messages.length-1)d.append(el('div',{class:'ac'},el('button',{class:'btn',onclick:toHost},'Host project'),el('button',{class:'btn solid',onclick:toEditor},'Open editor')));
    msgs.append(d)});msgs.scrollTop=msgs.scrollHeight}
function preview(){if(!p.files)return;$('#empty').hidden=true;ifr.hidden=false;ifr.srcdoc=NX.combine(p.files)}
function step(i){stepsEl.hidden=false;stepsEl.replaceChildren(...STEPS.map((s,k)=>el('li',{class:k<i||i===3&&k===3?'ok':k===i?'on':''},s)))}

  gen.disabled=busy;$('#status').textContent=busy?'Working…':'Ready'}

async function generateWebsite(prompt,files){

async function run(text,retry){

    add({r:'e',t:e.status===429?'Generation limit reached. '+e.message:'Generation failed: '+e.message,retry:text})}

const toEditor=()=>{if(!requireSession())return;persist();location.href='editor.html?project='+encodeURIComponent(p.id)},toHost=()=>{if(!requireSession())return;if(!p.files){NX.toast('Generate a website first, then host it.');return}persist();NX.host(p)};

ta.oninput=count;ta.onkeydown=e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();run(ta.value)}};
$('#clear').onclick=()=>{if(confirm('Clear the conversation? Your generated website is kept.')){p.messages=[];stepsEl.hidden=true;persist();render()}};
$('#btnEd').onclick=toEditor;$('#btnHost').onclick=toHost;
$('#pname').value=p.name;$('#pname').onchange=e=>{p.name=e.target.value.trim()||'Untitled website';persist()};
$('#refresh').onclick=()=>p.files?preview():NX.toast('Nothing to refresh yet. Generate a website first.');
document.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-w]').forEach(x=>x.classList.toggle('on',x===b));$('#frame').style.width=b.dataset.w});
$('#tabs').onclick=e=>{const v=e.target.dataset.v;if(!v)return;$('#ws').dataset.v=v;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===v))};
const TP={saas:'Create a modern SaaS landing page with a hero, features, testimonials and a contact section',portfolio:'Create a modern black-and-white portfolio website with a hero, gallery, about section and contact form',agency:'Create an agency website with services, case studies, team and a contact form',restaurant:'Create a restaurant website with a menu, gallery, opening hours and a reservation form',blog:'Create a personal blog with a featured post, article list, about section and newsletter form',product:'Create a product landing page with a hero, key features, specs and a call to action'};
const tq=new URLSearchParams(location.search).get('template');
render();preview();if(TP[tq]){ta.value=TP[tq];history.replaceState(null,'','builder.html')}count();
</script></body></html>
