<!doctype html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1"
>

<title>Hosted Website</title>


<!-- =======================================================
     PUBLIC HOST DETECTION
     ======================================================= -->

<script>

(function(){

  const params =
    new URLSearchParams(location.search);

  if(params.get('site')){

    document.documentElement.classList.add(
      'public-hosted'
    );

  }

})();

</script>


<!-- =======================================================
     LOGIN CHECK
     Public hosted websites do NOT require login.
     ======================================================= -->

<script>

(function(){

  const params =
    new URLSearchParams(location.search);

  if(
    params.get('site') ||
    params.get('project')
  ){

    return;

  }

  try{

    const session =
      JSON.parse(
        localStorage.getItem('nx_session')
      );

    if(
      session?.provider !== 'firebase'
    ){

      location.replace(
        'login.html?next=host.html'
      );

    }

  }catch{

    location.replace(
      'login.html?next=host.html'
    );

  }

})();

</script>


<!-- =======================================================
     FIREBASE
     ======================================================= -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script src="firebase-config.js"></script>


<!-- =======================================================
     FONTS
     ======================================================= -->

<link
  href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Hanken+Grotesk:wght@400;500;600&display=swap"
  rel="stylesheet"
>


<style>

/* =========================================================
   NEXORA HOST UI
   ========================================================= */

:root{

  --bg:#050505;
  --s1:#0d0d0d;
  --s2:#161616;

  --ln:rgba(255,255,255,.11);
  --ln2:rgba(255,255,255,.24);

  --tx:#f4f4f4;
  --mu:#9b9b9b;

  --head:
    'Bricolage Grotesque',
    'Helvetica Neue',
    Arial,
    sans-serif;

  --body:
    'Hanken Grotesk',
    'Helvetica Neue',
    Arial,
    sans-serif;

}


*{

  box-sizing:border-box;

  margin:0;
  padding:0;

}


html,
body{

  height:100%;

}


body{

  background:var(--bg);

  color:var(--tx);

  font:
    13.5px/1.55
    var(--body);

  font-variant-caps:small-caps;

  letter-spacing:.02em;

  display:flex;

  flex-direction:column;

  overflow:hidden;

}


button,
a{

  font:inherit;
  color:inherit;

}


a{

  text-decoration:none;

}


button{

  border:0;
  background:none;
  cursor:pointer;

}


/* =========================================================
   NEXORA HEADER
   ========================================================= */

.top{

  height:52px;

  flex:none;

  display:flex;

  align-items:center;

  gap:10px;

  padding:0 14px;

  border-bottom:
    1px solid var(--ln);

  background:var(--s1);

}


.logo{

  display:flex;

  align-items:center;

  gap:8px;

  font:
    700 15px var(--head);

  letter-spacing:0;

}


.logo svg{

  width:22px;
  height:22px;

  fill:none;

  stroke:currentColor;

  stroke-width:1.5;

}


.name{

  max-width:42vw;

  color:var(--mu);

  font-weight:600;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;

}


.sp{

  flex:1;

}


.mut{

  color:var(--mu);

  font-size:12px;

}


.btn{

  display:inline-flex;

  align-items:center;

  gap:7px;

  padding:6px 13px;

  border:
    1px solid var(--ln2);

  border-radius:99px;

  font-weight:600;

  font-size:12px;

  white-space:nowrap;

}


.btn:hover{

  border-color:#fff;

  background:var(--s2);

}


.solid{

  background:#fff;

  color:#000;

  border-color:#fff;

}


/* =========================================================
   HOST SHELL
   ========================================================= */

.shell{

  flex:1;

  min-height:0;

  display:flex;

  flex-direction:column;

}


.bar{

  height:42px;

  flex:none;

  display:flex;

  align-items:center;

  gap:9px;

  padding:0 14px;

  border-bottom:
    1px solid var(--ln);

  background:#080808;

}


.bar .dot{

  width:8px;
  height:8px;

  border-radius:50%;

  background:#54d38a;

}


.viewport{

  flex:1;

  min-height:0;

  padding:16px;

  overflow:auto;

  background:
    radial-gradient(
      circle,
      rgba(255,255,255,.07) 1px,
      transparent 1px
    )
    0 0 / 22px 22px;

}


.site{

  width:100%;

  min-height:100%;

  border:
    1px solid var(--ln2);

  border-radius:12px;

  overflow:hidden;

  background:#fff;

  box-shadow:
    0 24px 60px rgba(0,0,0,.5);

}


iframe{

  display:block;

  width:100%;

  height:100vh;

  min-height:100vh;

  border:0;

  background:#fff;

}


.empty{

  min-height:
    calc(100vh - 126px);

  display:grid;

  place-items:center;

  text-align:center;

  padding:30px;

  background:var(--s1);

  color:var(--mu);

}


.empty b{

  display:block;

  color:#fff;

  font:
    700 20px var(--head);

  margin-bottom:8px;

  letter-spacing:0;

}


.empty .btn{

  margin-top:16px;

}


/* =========================================================
   PUBLIC HOSTED WEBSITE MODE

   URL:
   host.html?site=your-site

   In this mode:
   - Nexora header hidden
   - status bar hidden
   - preview background removed
   - preview border removed
   - only generated website remains
   ========================================================= */

html.public-hosted,
html.public-hosted body{

  width:100%;

  min-width:100%;

  height:auto;

  min-height:100%;

  margin:0;

  padding:0;

  overflow:auto;

  background:#fff;

}


/* Hide Nexora header */

html.public-hosted .top{

  display:none !important;

}


/* Hide status bar */

html.public-hosted .bar{

  display:none !important;

}


/* Remove host shell */

html.public-hosted .shell{

  display:block;

  width:100%;

  height:auto;

  min-height:100vh;

}


/* Remove preview padding */

html.public-hosted .viewport{

  display:block;

  width:100%;

  height:auto;

  min-height:100vh;

  margin:0;

  padding:0;

  overflow:visible;

  background:#fff;

}


/* Remove preview card */

html.public-hosted .site{

  width:100%;

  height:auto;

  min-height:100vh;

  margin:0;

  padding:0;

  border:0;

  border-radius:0;

  overflow:visible;

  background:#fff;

  box-shadow:none;

}


/* Generated website iframe */

html.public-hosted iframe{

  display:block;

  width:100%;

  height:100vh;

  min-height:100vh;

  margin:0;

  padding:0;

  border:0;

  background:#fff;

}


/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:700px){

  .top{

    gap:7px;

  }

  .logo span{

    display:none;

  }

  .name{

    max-width:30vw;

  }

  .top .btn{

    padding:6px 9px;

  }

  .viewport{

    padding:8px;

  }

  .site{

    border-radius:8px;

  }

}


html.public-hosted .viewport{

  padding:0;

}


html.public-hosted .site{

  border-radius:0;

}

</style>

</head>


<body>


<!-- =======================================================
     NEXORA HOST HEADER
     Hidden automatically for public ?site= URLs
     ======================================================= -->

<header class="top">

  <a
    class="logo"
    href="index.html"
    aria-label="Nexora AI home"
  >

    <svg viewBox="0 0 28 28">

      <path
        d="M14 2l11 6v12l-11 6L3 20V8z"
      />

      <path
        d="M14 2v24M3 8l22 12M25 8L3 20"
        opacity=".45"
      />

    </svg>

    <span>Nexora AI</span>

  </a>


  <span
    class="name"
    id="projectName"
  >
    Hosted website
  </span>


  <span class="sp"></span>


  <a
    class="btn"
    href="builder.html"
  >
    Builder
  </a>


  <a
    class="btn"
    id="editorLink"
    href="editor.html"
  >
    Editor
  </a>

</header>


<!-- =======================================================
     HOST SHELL
     ======================================================= -->

<main class="shell">


  <div class="bar">

    <span
      class="dot"
      aria-hidden="true"
    ></span>


    <span id="status">
      Loading…
    </span>


    <span class="sp"></span>


    <span class="mut">
      sandboxed
    </span>

  </div>


  <div class="viewport">

    <div
      class="site"
      id="site"
    ></div>

  </div>

</main>


<script>

/* =========================================================
   FIREBASE INITIALIZATION
   ========================================================= */

const firebaseReady =
  Boolean(

    window.firebase &&

    window.FIREBASE_CONFIG?.apiKey &&

    window.FIREBASE_CONFIG?.authDomain &&

    window.FIREBASE_CONFIG?.projectId &&

    window.FIREBASE_CONFIG?.appId

  );


if(
  firebaseReady &&
  !window.firebase.apps.length
){

  window.firebase.initializeApp(
    window.FIREBASE_CONFIG
  );

}


const firestore =
  firebaseReady &&
  window.firebase.firestore

    ? window.firebase.firestore()

    : null;


/* =========================================================
   STATUS
   ========================================================= */

function $status(text){

  const el =
    document.querySelector('#status');

  if(el){

    el.textContent = text;

  }

}


/* =========================================================
   LOCAL PROJECT
   ========================================================= */

function loadLocalProject(){

  try{

    return JSON.parse(
      localStorage.getItem('nx_project')
    );

  }catch{

    return null;

  }

}


function findLocalProject(id){

  try{

    const list =
      JSON.parse(
        localStorage.getItem('nx_projects') || '[]'
      );

    return list.find(
      p =>
        p &&
        p.id === id
    ) || null;

  }catch{

    return null;

  }

}


/* =========================================================
   LOAD FIREBASE HOSTED WEBSITE
   ========================================================= */

async function loadHostedProject(slug){

  if(!firestore){

    throw Object.assign(

      new Error(
        'Firebase is not configured on this page.'
      ),

      {
        code:
          'firebase_not_configured'
      }

    );

  }


  const cleanSlug =
    String(slug || '')
      .trim()
      .toLowerCase();


  if(
    !cleanSlug ||
    !/^[a-z0-9][a-z0-9-]{0,39}$/.test(cleanSlug)
  ){

    throw Object.assign(

      new Error(
        'Invalid website subdomain.'
      ),

      {
        code:
          'invalid_slug'
      }

    );

  }


  const ref =
    firestore
      .collection('sites')
      .doc(cleanSlug);


  const doc =
    await ref.get();


  if(!doc.exists){

    throw Object.assign(

      new Error(
        'This website could not be found.'
      ),

      {
        code:
          'not_found'
      }

    );

  }


  const data =
    doc.data() || {};


  if(
    !data.files ||
    typeof data.files !== 'object'
  ){

    throw Object.assign(

      new Error(
        'This website has invalid or missing files.'
      ),

      {
        code:
          'invalid_site'
      }

    );

  }


  return {

    id:
      cleanSlug,

    slug:
      cleanSlug,

    name:
      typeof data.name === 'string' &&
      data.name.trim()
        ? data.name.trim()
        : 'Hosted website',

    visibility:
      data.visibility === 'private'
        ? 'private'
        : 'public',

    uid:
      data.uid || null,

    files:{

      html:
        typeof data.files.html === 'string'
          ? data.files.html
          : '',

      css:
        typeof data.files.css === 'string'
          ? data.files.css
          : '',

      js:
        typeof data.files.js === 'string'
          ? data.files.js
          : ''

    }

  };

}


/* =========================================================
   RESOLVE PROJECT
   ========================================================= */

async function resolveProject(){

  const params =
    new URLSearchParams(
      location.search
    );


  const slug =
    params.get('site');


  if(slug){

    return await loadHostedProject(
      slug
    );

  }


  const id =
    params.get('project');


  if(id){

    const found =
      findLocalProject(id);

    if(found){

      return found;

    }

    throw Object.assign(

      new Error(
        'This local project could not be found.'
      ),

      {
        code:
          'not_found'
      }

    );

  }


  return loadLocalProject();

}


/* =========================================================
   NEXORA FOOTER
   This is inserted INTO the generated website.
   ========================================================= */

const NEXORA_FOOTER = `

<style>

#nexora-powered-by{

  width:100%;

  box-sizing:border-box;

  margin:0;

  padding:20px 24px;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  font-size:11px;

  line-height:1.4;

  letter-spacing:.04em;

  color:#777;

  text-align:left;

  background:transparent;

  clear:both;

}

#nexora-powered-by span{

  opacity:.85;

}

</style>

<div
  id="nexora-powered-by"
  aria-label="Powered by Nexora AI"
>
  <span>Powered by Nexora AI</span>
</div>

`;


/* =========================================================
   RESIZE SCRIPT
   ========================================================= */

const RESIZE_SCRIPT = `

<script>

(function(){

  function sendHeight(){

    try{

      const bodyHeight =
        document.body
          ? document.body.scrollHeight
          : 0;

      const htmlHeight =
        document.documentElement
          ? document.documentElement.scrollHeight
          : 0;

      const height =
        Math.max(
          bodyHeight,
          htmlHeight
        );

      window.parent.postMessage(

        {
          type:
            'nexora-host-height',

          height:
            height
        },

        '*'

      );

    }catch(e){}

  }


  window.addEventListener(
    'load',
    sendHeight
  );


  window.addEventListener(
    'resize',
    sendHeight
  );


  if(
    typeof ResizeObserver !==
    'undefined'
  ){

    const observer =
      new ResizeObserver(
        sendHeight
      );

    observer.observe(
      document.documentElement
    );

  }


  setTimeout(
    sendHeight,
    100
  );

  setTimeout(
    sendHeight,
    500
  );

  setTimeout(
    sendHeight,
    1000
  );

})();

<\/script>

`;


/* =========================================================
   COMBINE GENERATED WEBSITE
   ========================================================= */

function combine(files){

  if(
    !files ||
    typeof files !== 'object'
  ){

    return '';

  }


  let html =
    files.html || '';

  const css =
    files.css || '';

  const js =
    files.js || '';


  let cssInjected =
    false;

  let jsInjected =
    false;


  /* -------------------------------------------------------
     Make sure a complete HTML document exists
     ------------------------------------------------------- */

  if(
    !/<html[\s>]/i.test(html)
  ){

    html =
      '<!doctype html>' +
      '<html>' +
      '<head></head>' +
      '<body>' +
      html +
      '</body>' +
      '</html>';

  }


  /* -------------------------------------------------------
     Inject CSS
     ------------------------------------------------------- */

  html =
    html.replace(

      /<link[^>]+style\.css[^>]*>/i,

      function(){

        cssInjected = true;

        return (
          '<style>\n' +
          css +
          '\n</style>'
        );

      }

    );


  /* -------------------------------------------------------
     Inject JS
     ------------------------------------------------------- */

  html =
    html.replace(

      /<script[^>]+src=["']script\.js["'][^>]*>\s*<\/script>/i,

      function(){

        jsInjected = true;

        return (
          '<script>\n' +
          js +
          '\n<\/script>'
        );

      }

    );


  /* -------------------------------------------------------
     CSS fallback
     ------------------------------------------------------- */

  if(
    !cssInjected &&
    css
  ){

    if(
      /<\/head>/i.test(html)
    ){

      html =
        html.replace(

          /<\/head>/i,

          '<style>\n' +
          css +
          '\n</style>' +
          '</head>'

        );

    }else{

      html =
        '<style>\n' +
        css +
        '\n</style>\n' +
        html;

    }

  }


  /* -------------------------------------------------------
     JS fallback
     ------------------------------------------------------- */

  if(
    !jsInjected &&
    js
  ){

    if(
      /<\/body>/i.test(html)
    ){

      html =
        html.replace(

          /<\/body>/i,

          '<script>\n' +
          js +
          '\n<\/script>' +
          '</body>'

        );

    }else{

      html +=
        '\n<script>\n' +
        js +
        '\n<\/script>';

    }

  }


  /* =======================================================
     ADD POWERED BY NEXORA AI
     ONLY TO PUBLIC HOSTED WEBSITES
     ======================================================= */

  if(
    /<\/body>/i.test(html)
  ){

    html =
      html.replace(

        /<\/body>/i,

        NEXORA_FOOTER +
        RESIZE_SCRIPT +
        '</body>'

      );

  }else{

    html +=
      NEXORA_FOOTER +
      RESIZE_SCRIPT;

  }


  return html;

}


/* =========================================================
   EMPTY STATE
   ========================================================= */

function showEmpty(){

  const site =
    document.querySelector('#site');


  site.innerHTML = `

    <div class="empty">

      <div>

        <b>
          No hosted website yet
        </b>

        Generate a website in
        Builder first.

        <br>

        <a
          class="btn solid"
          href="builder.html"
        >
          Open Builder
        </a>

      </div>

    </div>

  `;

}


/* =========================================================
   ERROR STATE
   ========================================================= */

function showError(
  title,
  message
){

  const site =
    document.querySelector('#site');


  site.innerHTML = `

    <div class="empty">

      <div>

        <b>
          ${title}
        </b>

        ${message}

        <br>

        <a
          class="btn"
          href="builder.html"
        >
          Back to Builder
        </a>

      </div>

    </div>

  `;

}


/* =========================================================
   AUTO RESIZE IFRAME
   ========================================================= */

window.addEventListener(
  'message',
  function(event){

    const data =
      event.data;


    if(
      !data ||
      data.type !==
      'nexora-host-height'
    ){

      return;

    }


    const frame =
      document.querySelector(
        '#site iframe'
      );


    if(!frame){

      return;

    }


    const height =
      Number(data.height);


    if(
      !Number.isFinite(height) ||
      height <= 0
    ){

      return;

    }


    frame.style.height =
      Math.ceil(
        height + 2
      ) + 'px';


    frame.style.minHeight =
      Math.ceil(
        height + 2
      ) + 'px';

  }
);


/* =========================================================
   OPEN WEBSITE
   ========================================================= */

(async function(){

  const site =
    document.querySelector('#site');

  const projectName =
    document.querySelector('#projectName');

  const editorLink =
    document.querySelector('#editorLink');


  try{

    const project =
      await resolveProject();


    /* -----------------------------------------------------
       No project
       ----------------------------------------------------- */

    if(
      !project ||
      !project.files
    ){

      $status(
        'Nothing hosted yet'
      );

      showEmpty();

      return;

    }


    /* -----------------------------------------------------
       Project name
       ----------------------------------------------------- */

    if(projectName){

      projectName.textContent =
        project.name ||
        'Hosted website';

    }


    /* -----------------------------------------------------
       Editor link
       ----------------------------------------------------- */

    if(editorLink){

      if(
        project.id &&
        !project.slug
      ){

        editorLink.href =
          'editor.html?project=' +
          encodeURIComponent(
            project.id
          );

      }else{

        editorLink.href =
          'editor.html';

      }

    }


    /* -----------------------------------------------------
       Validate HTML
       ----------------------------------------------------- */

    if(
      typeof project.files.html !==
      'string' ||
      !project.files.html.trim()
    ){

      $status(
        'Website has no HTML'
      );

      showError(
        'Invalid website',
        'The published website does not contain valid HTML.'
      );

      return;

    }


    /* -----------------------------------------------------
       Status
       ----------------------------------------------------- */

    $status(

      project.slug
        ? 'Website is live'
        : 'Local preview'

    );


    /* -----------------------------------------------------
       CREATE IFRAME
       ----------------------------------------------------- */

    const frame =
      document.createElement(
        'iframe'
      );


    frame.title =
      project.name ||
      'Hosted website';


    frame.sandbox =
      'allow-scripts allow-forms allow-modals';


    frame.referrerPolicy =
      'no-referrer';


    /*
     * IMPORTANT:
     *
     * The generated website itself is the iframe
     * content. The Nexora header is NOT inside it.
     */

    frame.srcdoc =
      combine(
        project.files
      );


    /*
     * Start with a large enough height.
     * The resize script will replace this
     * with the actual website height.
     */

    frame.style.height =
      '100vh';

    frame.style.minHeight =
      '100vh';


    frame.addEventListener(
      'load',
      function(){

        if(project.slug){

          $status(
            'Website is live'
          );

        }else{

          $status(
            'Local preview'
          );

        }

      }
    );


    site.innerHTML = '';

    site.append(frame);


  }catch(error){

    console.error(
      'Hosted website loading error:',
      error
    );


    const code =
      error?.code;


    if(
      code ===
      'firebase_not_configured'
    ){

      $status(
        'Firebase configuration error'
      );

      showError(
        'Firebase is not configured',
        'Check your firebase-config.js configuration.'
      );

      return;

    }


    if(
      code ===
      'permission-denied'
    ){

      $status(
        'Access denied'
      );

      showError(
        'Website cannot be loaded',
        'Firestore Security Rules are blocking access to this website.'
      );

      return;

    }


    if(
      code ===
      'not_found'
    ){

      $status(
        'Website not found'
      );

      showError(
        'Website not found',
        'The requested website does not exist or has been removed.'
      );

      return;

    }


    if(
      code ===
      'invalid_slug'
    ){

      $status(
        'Invalid website address'
      );

      showError(
        'Invalid website address',
        'The website subdomain is not valid.'
      );

      return;

    }


    if(
      code ===
      'invalid_site'
    ){

      $status(
        'Invalid website'
      );

      showError(
        'Invalid website',
        'The published website data is incomplete.'
      );

      return;

    }


    $status(
      'Website unavailable'
    );


    showError(

      'Website temporarily unavailable',

      error?.message ||
      'An unexpected error occurred while loading the website.'

    );

  }

})();

</script>


</body>

</html>
