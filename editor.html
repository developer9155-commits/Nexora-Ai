const R={html:[[/&lt;!--[\s\S]*?--&gt;/,'c'],[/&lt;\/?[a-zA-Z][\w-]*/,'t'],[/"[^"]*"|'[^']*'/,'s'],[/&gt;/,'t']],
css:[[/\/\*[\s\S]*?\*\//,'c'],[/"[^"]*"|'[^']*'/,'s'],[/#[0-9a-fA-F]{3,8}\b|-?\d*\.?\d+(?:px|rem|em|%|vh|vw|s|ms|deg)?/,'n'],[/[\w-]+(?=\s*:)|@[\w-]+/,'t']],
js:[[/\/\/.*|\/\*[\s\S]*?\*\//,'c'],[/`[^`]*`|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'/,'s'],[/\b(?:const|let|var|function|return|if|else|for|while|new|class|import|export|async|await|try|catch|throw|this|document|window)\b/,'t'],[/\b\d+\.?\d*\b/,'n']]};
const hl=(code,l)=>{const rs=R[l],re=new RegExp(rs.map(r=>'('+r[0].source+')').join('|'),'g');
  return code.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(re,(m,...g)=>'<span class="'+rs[g.findIndex(x=>x!==undefined)][1]+'">'+m+'</span>')};
const ta=$('#ta'),pre=$('#pre'),gut=$('#gut'),ifr=$('#ifr'),lh=$('#lh'),side=$('#side'),wb=$('#wb');
$('#pf').textContent=(p.name||'website').toLowerCase().replace(/[^a-z0-9]+/g,'-');
const paint=()=>{pre.innerHTML=hl(ta.value,cur)+'\n';gut.innerHTML=ta.value.split('\n').map((_,i)=>'<b>'+(i+1)+'</b>').join('');caret(true)};
const scr=()=>{pre.scrollTop=gut.scrollTop=ta.scrollTop;pre.scrollLeft=ta.scrollLeft;lh.style.top=(12+(ln-1)*20-ta.scrollTop)+'px'};
let ln=1;
function caret(force){if(!cur)return;const v=ta.value.slice(0,ta.selectionStart),n=v.split('\n').length;
  $('#sp1').textContent='Ln '+n+', Col '+(v.length-v.lastIndexOf('\n'));
  if(n!==ln||force){const b=gut.children;if(b[ln-1])b[ln-1].className='';ln=n;if(b[ln-1])b[ln-1].className='a'}lh.style.top=(12+(ln-1)*20-ta.scrollTop)+'px'}
const prev=()=>{ifr.srcdoc=NX.combine(F)};
const status=()=>{const t=dirty?'Unsaved changes':'All changes saved';$('#ds').textContent=t;$('#sp3').textContent=t};
function tabs(){$('#tb').replaceChildren(...open.map(k=>el('div',{class:'tab'+(k===cur?' on':''),onclick:()=>show(k)},N[k],
  mod.has(k)?el('span',{class:'d',title:'Unsaved'}):el('button',{class:'x','aria-label':'Close '+N[k],onclick:e=>{e.stopPropagation();closeTab(k)}},...[])),),el('span',{class:'sp'}),
  el('button',{class:'icn','aria-label':'Refresh preview',title:'Run / refresh preview',onclick:prev}));
  $('#tb').querySelectorAll('.x').forEach(x=>x.innerHTML=I('x'));
  $('#tb').querySelector('.icn').innerHTML=I('play');
  $('#ex').replaceChildren(...K.map(k=>{const b=el('button',{class:'fi code'+(k===cur?' on':''),onclick:()=>{show(k);side.classList.remove('open')}},N[k]);b.insertAdjacentHTML('afterbegin',I('files'));if(mod.has(k))b.append(el('i'));return b}))}
function show(k){if(!open.includes(k))open.push(k);cur=k;ta.value=F[k];$('#box').hidden=$('#cr').hidden=false;$('#wel').hidden=true;
  $('#cr').innerHTML=$('#pf').textContent+' &rsaquo; <b>'+N[k]+'</b>';$('#sp2').textContent=LN[k];paint();scr();tabs()}
function closeTab(k){open=open.filter(x=>x!==k);if(cur!==k){tabs();return}
  if(open.length)show(open[open.length-1]);else{cur=null;$('#box').hidden=$('#cr').hidden=true;$('#wel').hidden=false;$('#sp1').textContent='';$('#sp2').textContent='';tabs()}}
ta.oninput=()=>{F[cur]=ta.value;dirty=true;if(!mod.has(cur)){mod.add(cur);tabs()}status();cancelAnimationFrame(raf);raf=requestAnimationFrame(paint);clearTimeout(t1);t1=setTimeout(prev,500)};
ta.onscroll=scr;['keyup','click','focus'].forEach(ev=>ta.addEventListener(ev,()=>caret()));
ta.onkeydown=e=>{if(e.key==='Tab'){e.preventDefault();ta.setRangeText('  ',ta.selectionStart,ta.selectionEnd,'end');ta.oninput()}};
addEventListener('keydown',e=>{const m=e.ctrlKey||e.metaKey,k=e.key.toLowerCase();if(m&&k==='s'){e.preventDefault();save()}if(m&&k==='b'){e.preventDefault();side.classList.toggle('hide')}});
function save(){p.files={...F};NX.save(p);dirty=false;mod.clear();tabs();status();NX.toast('Saved')}
// activity bar
document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const a=b.dataset.a;
  if(a==='pv'){const open=$('#rv').classList.toggle('open');b.classList.toggle('on',open);return}
  if(a===sv&&!side.classList.contains('hide')){side.classList.add('hide');b.classList.remove('on');return}
  sv=a;side.classList.remove('hide');$('#vex').hidden=a!=='ex';$('#vse').hidden=a!=='se';
  document.querySelectorAll('[data-a="ex"],[data-a="se"]').forEach(x=>x.classList.toggle('on',x===b));if(a==='se')$('#q').focus()});
// search
$('#q').oninput=e=>{const q=e.target.value,res=$('#res');res.replaceChildren();if(!q)return;let n=0;const lq=q.toLowerCase();
  for(const k of K){const hits=[];F[k].split('\n').forEach((t,i)=>{const c=t.toLowerCase().indexOf(lq);if(c>-1&&n<200){n++;hits.push([i+1,c,t.trim()])}});
    if(hits.length){res.append(el('div',{class:'rg code'},N[k]+' ('+hits.length+')'),...hits.map(([l,c,t])=>el('button',{class:'rl code',onclick:()=>goto(k,l,c,q.length)},l+': '+t)))}}
  if(!n)res.append(el('p',{class:'mut',style:'padding:6px 16px'},'No results.'))};
function goto(k,l,c,len){show(k);const ls=F[k].split('\n');let pos=0;for(let i=0;i<l-1;i++)pos+=ls[i].length+1;pos+=c;ta.focus();ta.setSelectionRange(pos,pos+len);ta.scrollTop=Math.max(0,(l-6)*20);scr();caret();side.classList.remove('open')}
// header + preview + mobile
$('#save').onclick=save;$('#rf').onclick=prev;
$('#copy').onclick=()=>cur?navigator.clipboard.writeText(F[cur]).then(()=>NX.toast(N[cur]+' copied'),()=>NX.toast('Copy failed')):NX.toast('Open a file first');
$('#dl').onclick=()=>{save();NX.downloadProject(p)};
$('#host').onclick=()=>{save();NX.host(p)};
$('#pn').textContent=p.name||'Untitled website';
$('#mt').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='mf'){side.classList.toggle('open');return}wb.dataset.v=b.dataset.v;$('#rv').classList.toggle('open',b.dataset.v==='prev');document.querySelectorAll('#mt [data-v]').forEach(x=>x.classList.toggle('on',x===b))};
addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
show('html');prev();status();
}
</script></body></html>
